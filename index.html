<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Sana | задачи, которые готовы к работе</title>
	<style>
		:root {
			--ink: #17211b;
			--muted: #68736b;
			--line: #d9dfd8;
			--paper: #f7f8f4;
			--card: #ffffff;
			--leaf: #237a5b;
			--leaf-dark: #15523d;
			--lime: #d9ef79;
			--orange: #ef8d4d;
			--soft: #edf3ec;
			--shadow: 0 16px 45px rgba(26, 50, 36, .08);
		}
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
		button, input, textarea, select { font: inherit; }
		button { cursor: pointer; border: 0; }
		.app { min-height: 100vh; display: grid; grid-template-columns: 258px 1fr; }
		.sidebar { background: var(--leaf-dark); color: #f3f7eb; padding: 28px 20px; display: flex; flex-direction: column; }
		.brand { display: flex; align-items: center; gap: 10px; font-size: 27px; letter-spacing: -.04em; margin-bottom: 46px; }
		.brand-mark { width: 30px; height: 30px; background: var(--lime); color: var(--leaf-dark); border-radius: 50% 50% 50% 8px; display: grid; place-items: center; font-family: Arial, sans-serif; font-weight: 800; transform: rotate(-20deg); }
		.brand-mark span { transform: rotate(20deg); }
		.role-label, .eyebrow { text-transform: uppercase; letter-spacing: .14em; font: 11px Arial, sans-serif; font-weight: 700; }
		.role-label { color: #a9c9b5; margin: 0 0 12px 12px; }
		.nav { display: grid; gap: 5px; }
		.nav button { text-align: left; color: #bbd5c4; padding: 13px 12px; border-radius: 8px; background: transparent; font: 15px Arial, sans-serif; }
		.nav button:hover, .nav button.active { color: #fff; background: rgba(255,255,255,.12); }
		.nav button.active { box-shadow: inset 3px 0 var(--lime); }
		.side-note { margin-top: auto; border-top: 1px solid rgba(255,255,255,.14); padding: 20px 12px 0; color: #afd0bc; font: 12px/1.6 Arial, sans-serif; }
		.side-note strong { display: block; color: #f3f7eb; font-size: 13px; margin-bottom: 4px; }
		main { min-width: 0; }
		.topbar { height: 78px; padding: 18px 42px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); background: rgba(247,248,244,.82); }
		.crumb { font: 13px Arial, sans-serif; color: var(--muted); }
		.user { display: flex; align-items: center; gap: 10px; font: 13px Arial, sans-serif; }
		.avatar { width: 34px; height: 34px; display: grid; place-items: center; color: var(--leaf-dark); background: var(--lime); border-radius: 50%; font-weight: 700; }
		.content { max-width: 1180px; padding: 52px 42px 80px; margin: auto; }
		h1, h2, h3, p { margin-top: 0; }
		h1 { max-width: 700px; font-size: clamp(38px, 5vw, 65px); line-height: .98; letter-spacing: -.06em; margin-bottom: 16px; font-weight: 500; }
		h2 { font-size: 31px; letter-spacing: -.04em; margin-bottom: 8px; font-weight: 500; }
		h3 { font-size: 20px; margin-bottom: 8px; }
		.lead { color: var(--muted); max-width: 590px; font: 16px/1.6 Arial, sans-serif; }
		.eyebrow { color: var(--leaf); margin-bottom: 14px; }
		.hero { display: flex; justify-content: space-between; gap: 40px; align-items: end; margin-bottom: 44px; }
		.hero-stamp { width: 170px; height: 170px; border: 1px solid #b9ccba; border-radius: 50%; display: grid; place-items: center; text-align: center; color: var(--leaf); font: 12px/1.4 Arial, sans-serif; transform: rotate(8deg); flex: none; }
		.hero-stamp b { display: block; font: 42px Georgia, serif; color: var(--ink); letter-spacing: -.06em; }
		.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, .8fr); gap: 22px; }
		.panel, .task-card, .proposal { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
		.panel { padding: 26px; }
		.panel-header { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 20px; }
		label { display: block; font: 12px Arial, sans-serif; color: var(--muted); margin-bottom: 8px; }
		textarea, input, select { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fbfcfa; color: var(--ink); padding: 14px; outline: 0; }
		textarea:focus, input:focus, select:focus { border-color: var(--leaf); box-shadow: 0 0 0 3px rgba(35,122,91,.12); }
		textarea { min-height: 205px; resize: vertical; line-height: 1.55; }
		.button-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
		.btn { border-radius: 5px; padding: 12px 17px; background: var(--leaf); color: white; font: 13px Arial, sans-serif; font-weight: 700; }
		.btn:hover { background: var(--leaf-dark); }
		.btn.secondary { color: var(--ink); background: #edf1eb; }
		.btn.ghost { color: var(--leaf); background: transparent; border: 1px solid var(--line); }
		.btn.lime { color: var(--leaf-dark); background: var(--lime); }
		.stat-list { display: grid; gap: 14px; }
		.stat { display: flex; justify-content: space-between; align-items: end; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
		.stat:last-child { border: 0; }
		.stat span { color: var(--muted); font: 12px Arial, sans-serif; }
		.stat b { font-size: 25px; font-weight: 500; }
		.progress-wrap { margin: 14px 0 6px; }
		.progress { height: 10px; background: #e6ebe4; border-radius: 20px; overflow: hidden; }
		.progress i { display: block; height: 100%; background: var(--orange); border-radius: inherit; transition: width .4s ease; }
		.score { display: flex; align-items: center; gap: 16px; }
		.score-number { font-size: 54px; letter-spacing: -.07em; line-height: 1; }
		.level { color: var(--orange); font: 12px Arial, sans-serif; font-weight: 700; }
		.question { padding: 15px 0; border-bottom: 1px solid var(--line); }
		.question:last-child { border: 0; }
		.question-num { color: var(--orange); font: 12px Arial, sans-serif; font-weight: 700; }
		.question p { margin: 5px 0 10px; font-size: 17px; }
		.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
		.field.full { grid-column: 1 / -1; }
		.section-title { display: flex; justify-content: space-between; align-items: center; margin: 34px 0 14px; }
		.section-title h3 { margin: 0; }
		.tag { display: inline-block; padding: 5px 8px; border-radius: 20px; background: var(--soft); color: var(--leaf); font: 11px Arial, sans-serif; font-weight: 700; }
		.catalog-head { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 26px; }
		.filters { display: flex; gap: 8px; width: min(390px, 100%); }
		.filters select { padding: 10px; }
		.task-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
		.task-card { padding: 22px; box-shadow: none; transition: transform .2s ease, box-shadow .2s ease; }
		.task-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
		.task-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
		.mini-score { color: var(--leaf); font: 22px Georgia, serif; }
		.task-card p { color: var(--muted); font: 13px/1.5 Arial, sans-serif; }
		.task-card footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 18px; font: 11px Arial, sans-serif; color: var(--muted); }
		.proposal { padding: 20px; box-shadow: none; margin-bottom: 12px; }
		.proposal-head { display: flex; justify-content: space-between; gap: 15px; }
		.proposal p { color: var(--muted); font: 13px/1.5 Arial, sans-serif; }
		.empty { text-align: center; padding: 55px 20px; background: #fff; border: 1px dashed #b9c8ba; border-radius: 10px; color: var(--muted); font: 14px Arial, sans-serif; }
		.toast { position: fixed; right: 24px; bottom: 24px; background: var(--ink); color: #fff; border-radius: 6px; padding: 14px 18px; font: 13px Arial, sans-serif; box-shadow: var(--shadow); animation: rise .25s ease; }
		@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
		@media (max-width: 800px) { .app { grid-template-columns: 1fr; } .sidebar { padding: 18px; } .brand { margin-bottom: 20px; } .nav { display: flex; overflow: auto; } .nav button { white-space: nowrap; } .side-note { display: none; } .topbar { padding: 14px 20px; } .content { padding: 32px 20px 60px; } .hero, .catalog-head { display: block; } .hero-stamp { margin-top: 25px; } .grid, .task-grid, .field-grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } .filters { margin-top: 18px; width: 100%; } }
	</style>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand"><div class="brand-mark"><span>S</span></div> sana</div>
			<div class="role-label">Рабочее пространство</div>
			<nav class="nav" id="nav"></nav>
			<div class="side-note"><strong>Правило Sana</strong>Система подсказывает и считает, но бизнес сам выбирает команду.</div>
		</aside>
		<main>
			<header class="topbar"><div class="crumb" id="crumb">Бизнес / Новая задача</div><div class="user"><span>Анна Смирнова</span><div class="avatar">АС</div></div></header>
			<div class="content" id="content"></div>
		</main>
	</div>
	<script>
		const seedText = 'Мы хотим лучше понимать, почему посетители уходят из интернет-магазина до оформления заказа. Есть сайт и выгрузка заказов, но пока непонятно, какие изменения дадут наибольший эффект.';
		const state = { view: 'new', draft: seedText, questions: ['', '', ''], published: false, score: 42, proposalSent: false, selected: false, card: { title: 'Снижение оттока в интернет-магазине', context: 'Посетители уходят до оформления заказа. Нужно понять причины и точки роста.', users: 'Клиенты интернет-магазина и команда e-commerce', data: 'Выгрузка заказов, веб-аналитика, записи сессий', constraints: 'MVP за 3 недели, без изменения платёжного модуля', result: 'Список причин оттока и прототип 2–3 улучшений', success: 'Конверсия в оформление заказа вырастет на 10%', contact: 'Анна Смирнова, созвон по вторникам' } };
		const views = { new: ['Бизнес', 'Новая задача'], questions: ['Бизнес', 'Уточнение'], card: ['Бизнес', 'Карточка и рейтинг'], proposals: ['Бизнес', 'Отклики команд'], catalog: ['Команды', 'Общий каталог'], teamTask: ['Команды', 'Задача'] };
		const navItems = [{ id: 'new', label: 'Создать задачу' }, { id: 'card', label: 'Моя задача' }, { id: 'proposals', label: 'Отклики · 2' }, { id: 'catalog', label: 'Каталог задач' }];
		const scoreFields = [['context', 'Контекст и потребность', 20], ['data', 'Данные и материалы', 20], ['result', 'Ожидаемый результат', 15], ['success', 'Критерии успеха', 15], ['constraints', 'Ограничения', 10], ['users', 'Пользователи', 10], ['contact', 'Связь с бизнесом', 10]];
		function esc(value) { return String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[c])); }
		function renderNav() { document.querySelector('#nav').innerHTML = navItems.map(item => `<button class="${state.view === item.id || (state.view === 'teamTask' && item.id === 'catalog') ? 'active' : ''}" onclick="go('${item.id}')">${item.label}</button>`).join(''); }
		function go(view) { state.view = view; render(); }
		function render() { renderNav(); const meta = views[state.view] || views.new; document.querySelector('#crumb').textContent = meta.join(' / '); document.querySelector('#content').innerHTML = templates[state.view](); }
		function showToast(text) { document.querySelector('.toast')?.remove(); const el = document.createElement('div'); el.className = 'toast'; el.textContent = text; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
		function analyze() { state.draft = document.querySelector('#draft').value.trim(); if (!state.draft) return showToast('Добавьте описание задачи'); state.questions = ['Какой показатель должен измениться после решения?', 'Какие данные команда сможет использовать уже на старте?', 'Есть ли ограничения по срокам, технологиям или доступам?']; state.view = 'questions'; render(); }
		function buildCard() { state.questions = [...document.querySelectorAll('.answer')].map(input => input.value); state.view = 'card'; showToast('Черновик превращён в редактируемую карточку'); render(); }
		function updateCard() { document.querySelectorAll('[data-field]').forEach(input => state.card[input.dataset.field] = input.value); state.score = Math.min(100, scoreFields.reduce((sum, field) => sum + (state.card[field[0]].trim().length > 15 ? field[2] : 0), 0)); render(); showToast('Рейтинг пересчитан после подтверждения'); }
		function publish() { updateCard(); state.published = true; state.view = 'catalog'; render(); showToast('Задача опубликована в общем каталоге'); }
		function sendProposal() { state.proposalSent = true; render(); showToast('Предложение отправлено бизнесу'); }
		function chooseProposal() { state.selected = true; render(); showToast('Команда выбрана вручную. Следующий этап открыт.'); }
		function fieldInput(key, label, value, full = false) { return `<div class="field ${full ? 'full' : ''}"><label>${label}</label><textarea data-field="${key}" rows="3">${esc(value)}</textarea></div>`; }
		const templates = {
			new: () => `<div class="hero"><div><div class="eyebrow">Шаг 01 / Черновик</div><h1>Сделайте задачу понятной тем, кто поможет её решить.</h1><p class="lead">Опишите потребность своими словами. Sana найдёт пробелы, задаст вопросы и превратит идею в карточку, готовую для команд.</p></div><div class="hero-stamp"><div><b>5</b>минут до<br>первой версии</div></div></div><div class="grid"><section class="panel"><div class="panel-header"><div><h2>Что нужно решить?</h2><p class="lead">Сейчас достаточно контекста. Факты останутся за вами.</p></div><span class="tag">AI-помощник</span></div><label for="draft">Описание потребности</label><textarea id="draft">${esc(state.draft)}</textarea><div class="button-row"><button class="btn" onclick="analyze()">Проверить и уточнить →</button><button class="btn ghost" onclick="showToast('Черновик сохранён')">Сохранить черновик</button></div></section><aside class="panel"><div class="eyebrow">Как это работает</div><div class="stat-list"><div class="stat"><span>01 · Уточнение</span><b>3 вопроса</b></div><div class="stat"><span>02 · Рейтинг</span><b>0–100</b></div><div class="stat"><span>03 · Каталог</span><b>Открытый</b></div></div></aside></div>`,
			questions: () => `<div class="eyebrow">Шаг 02 / AI-помощник</div><h2>Уточним, чтобы задача стала сильнее</h2><p class="lead">Мы не добавляем факты за вас. Ответьте коротко, и вы сможете отредактировать результат перед публикацией.</p><section class="panel" style="margin-top:28px">${state.questions.map((question, i) => `<div class="question"><span class="question-num">0${i + 1}</span><p>${question}</p><input class="answer" placeholder="Ваш ответ..." value="${esc(i === 0 ? 'Конверсия в оформление заказа' : i === 1 ? 'Аналитика и выгрузка заказов' : 'До 3 недель')}"></div>`).join('')}<div class="button-row"><button class="btn" onclick="buildCard()">Собрать карточку →</button><button class="btn secondary" onclick="go('new')">Назад к описанию</button></div></section>`,
			card: () => { const level = state.score >= 90 ? 'Приоритетная' : state.score >= 70 ? 'Готовая' : state.score >= 40 ? 'Рабочая' : 'Черновик'; const missing = scoreFields.filter(f => state.card[f[0]].trim().length <= 15); return `<div class="eyebrow">Шаг 03–04 / Проверка человеком</div><div class="hero"><div><h2>Карточка задачи</h2><p class="lead">Отредактируйте формулировки и подтвердите их. Только подтверждённые поля влияют на рейтинг.</p></div><div class="score"><span class="score-number">${state.score}</span><div><div class="level">${level.toUpperCase()}</div><span class="muted">из 100 баллов</span></div></div></div><div class="grid"><section class="panel"><div class="field-grid">${fieldInput('title','Название',state.card.title,true)}${fieldInput('context','Контекст и потребность',state.card.context,true)}${fieldInput('users','Пользователи',state.card.users)}${fieldInput('data','Данные и материалы',state.card.data)}${fieldInput('constraints','Ограничения',state.card.constraints)}${fieldInput('result','Ожидаемый результат',state.card.result)}${fieldInput('success','Критерии успеха',state.card.success)}${fieldInput('contact','Контакт и формат взаимодействия',state.card.contact,true)}</div><div class="button-row"><button class="btn secondary" onclick="updateCard()">Пересчитать рейтинг</button><button class="btn lime" onclick="publish()">Подтвердить и опубликовать →</button></div></section><aside class="panel"><div class="eyebrow">Прогресс задачи</div><div class="progress-wrap"><div class="progress"><i style="width:${state.score}%"></i></div></div><h3>${state.score}% готовности</h3><p class="lead">${missing.length ? 'Чтобы подняться выше, уточните:' : 'Все ключевые сведения заполнены.'}</p><div class="stat-list">${scoreFields.map(f => `<div class="stat"><span>${f[1]}</span><b style="font-size:14px;color:${state.card[f[0]].trim().length > 15 ? 'var(--leaf)' : 'var(--orange)'}">${state.card[f[0]].trim().length > 15 ? '+' + f[2] : 'добавить'}</b></div>`).join('')}</div></aside></div>`; },
			catalog: () => `<div class="catalog-head"><div><div class="eyebrow">Шаг 05–06 / Открытый пул</div><h2>Задачи, которым нужны команды</h2><p class="lead">Рейтинг помогает понять объём уточнений. Он не скрывает задачи и не назначает исполнителей.</p></div><div class="filters"><select><option>Сортировка: рейтинг</option><option>Сначала новые</option></select><select><option>Все темы</option><option>E-commerce</option></select></div></div><div class="task-grid"><article class="task-card"><div class="task-meta"><span class="tag">E-commerce · рабочая</span><span class="mini-score">${state.score}/100</span></div><h3>${esc(state.card.title)}</h3><p>${esc(state.card.context)}</p><footer><span>Анна Смирнова · сегодня</span><button class="btn" onclick="go('teamTask')">Смотреть задачу →</button></footer></article><article class="task-card"><div class="task-meta"><span class="tag">EdTech · готовая</span><span class="mini-score">86/100</span></div><h3>Как повысить доходимость онлайн-курса</h3><p>Студенты начинают курс, но не доходят до финального модуля.</p><footer><span>Илья Ким · вчера</span><button class="btn ghost" onclick="showToast('Откройте задачу, чтобы отправить идею')">Смотреть задачу →</button></footer></article><article class="task-card"><div class="task-meta"><span class="tag">Retail · черновик</span><span class="mini-score">34/100</span></div><h3>Оптимизация выкладки в магазине</h3><p>Есть наблюдения продавцов, но пока не определены критерии успеха.</p><footer><span>Мария Левина · 2 дня</span><button class="btn ghost" onclick="showToast('Низкий рейтинг не запрещает отклик')">Смотреть задачу →</button></footer></article></div>`,
			teamTask: () => `<div class="eyebrow">Задача из каталога</div><div class="grid"><section class="panel"><span class="tag">E-commerce · ${state.score}/100</span><h2 style="margin-top:18px">${esc(state.card.title)}</h2><p class="lead">${esc(state.card.context)}</p><div class="section-title"><h3>Что уже известно</h3><span class="level">${state.score >= 70 ? 'ГОТОВАЯ' : 'РАБОЧАЯ'}</span></div><div class="field-grid">${[['Пользователи',state.card.users],['Данные',state.card.data],['Ограничения',state.card.constraints],['Результат',state.card.result]].map(x => `<div><label>${x[0]}</label><p>${esc(x[1])}</p></div>`).join('')}</div></section><section class="panel"><div class="eyebrow">Шаг 06 / Отклик команды</div><h3>Покажите, как вы начнёте</h3><label>Команда</label><input value="North Star" /><label style="margin-top:14px">Идея решения</label><textarea rows="4">Проведём воронку по сегментам, найдём точки оттока и соберём прототип двух изменений.</textarea><label style="margin-top:14px">План и срок</label><input value="Аналитика — 1 неделя, прототип — 2 недели" /><div class="button-row">${state.proposalSent ? '<span class="tag">Предложение на рассмотрении</span>' : '<button class="btn" onclick="sendProposal()">Отправить предложение →</button>'}</div></section></div>`,
			proposals: () => `<div class="eyebrow">Шаг 07–08 / Решение бизнеса</div><h2>Предложения команд</h2><p class="lead">Сравните идеи и примите решение сами. Можно выбрать несколько команд или продолжить поиск.</p><div style="margin-top:28px;max-width:820px"><div class="proposal"><div class="proposal-head"><div><span class="tag">Рекомендуем по навыкам</span><h3>North Star</h3></div><strong class="mini-score">96%</strong></div><p>Проведём анализ воронки по сегментам, найдём точки оттока и соберём прототип двух изменений. Готовы начать с интервью.</p><div class="button-row">${state.selected ? '<span class="tag">Выбрана · этап в работе</span>' : '<button class="btn lime" onclick="chooseProposal()">Выбрать команду</button><button class="btn ghost" onclick="showToast(\'Отклик отклонён\')">Отклонить</button>'}</div></div><div class="proposal"><div class="proposal-head"><div><span class="tag">Отклик · 2 дня назад</span><h3>Data Seeds</h3></div><strong class="mini-score">81%</strong></div><p>Сделаем дашборд причин ухода и предложим гипотезы для A/B-тестирования.</p><div class="button-row"><button class="btn ghost" onclick="showToast('Отклик отклонён')">Отклонить</button></div></div></div>`
		};
		render();
	</script>
